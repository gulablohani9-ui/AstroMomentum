<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroMomentum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: bold; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .positive { color: #10b981; font-weight: bold; }
        .negative { color: #ef4444; font-weight: bold; }
        .neutral { color: #f59e0b; font-weight: bold; }
        .tab-btn { cursor: pointer; }
        .action-btn { cursor: pointer; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-white">AstroMomentum</h1>
        <button onclick="toggleSettings()" class="text-blue-400 text-xl cursor-pointer">⚙️</button>
    </header>

    <!-- Settings Panel -->
    <div id="settingsPanel" class="hidden card mb-6 border border-slate-600">
        <h2 class="text-lg font-bold mb-3 text-blue-400">Settings</h2>
        <label class="block text-sm mb-1 text-slate-300">Latitude (Default: Mumbai)</label>
        <input type="number" id="lat" value="19.0760" step="0.0001" class="w-full p-2 mb-3 bg-slate-700 rounded text-white outline-none">
        <label class="block text-sm mb-1 text-slate-300">Longitude</label>
        <input type="number" id="lon" value="72.8777" step="0.0001" class="w-full p-2 mb-3 bg-slate-700 rounded text-white outline-none">
        <label class="block text-sm mb-1 text-slate-300">Ayanamsa</label>
        <select id="ayanamsa" class="w-full p-2 mb-3 bg-slate-700 rounded text-white outline-none">
            <option value="LAHIRI">Lahiri (Default)</option>
            <option value="KP">KP (Krishnamurti)</option>
            <option value="RAMAN">B.V. Raman</option>
            <option value="FAGAN_BRADLEY">Fagan Bradley</option>
        </select>
        <button onclick="saveSettings()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2 rounded font-bold cursor-pointer">Save Settings</button>
    </div>

    <!-- Tabs -->
    <div class="flex space-x-4 mb-4 border-b border-slate-700 pb-2 overflow-x-auto">
        <button onclick="showTab('daily')" id="tab-daily" class="tab-active tab-btn px-2 py-1 whitespace-nowrap">Daily</button>
        <button onclick="showTab('weekly')" id="tab-weekly" class="tab-btn px-2 py-1 whitespace-nowrap">Weekly</button>
        <button onclick="showTab('monthly')" id="tab-monthly" class="tab-btn px-2 py-1 whitespace-nowrap">Monthly</button>
        <button onclick="showTab('search')" id="tab-search" class="tab-btn px-2 py-1 whitespace-nowrap">Search</button>
        <button onclick="showTab('exact')" id="tab-exact" class="tab-btn px-2 py-1 whitespace-nowrap text-purple-400">Exact</button>
    </div>

    <!-- Loading / Error Message -->
    <div id="loading" class="text-center py-10 text-yellow-400 font-bold">Loading Astro Engine...</div>

    <!-- Content -->
    <div id="content-daily" class="content-section hidden"></div>
    <div id="content-weekly" class="content-section hidden"></div>
    <div id="content-monthly" class="content-section hidden"></div>
    
    <!-- Search Tab -->
    <div id="content-search" class="content-section hidden">
        <div class="card">
            <h2 class="text-lg font-bold mb-3 text-green-400">Search Transits by Degree</h2>
            <div class="grid grid-cols-2 gap-2 mb-3">
                <select id="searchP1" class="p-2 bg-slate-700 rounded text-white outline-none">
                    <option>Mars</option><option>Jupiter</option><option>Saturn</option>
                    <option>Moon</option><option>Mercury</option><option>Venus</option>
                    <option>Rahu</option><option>Ketu</option><option>Uranus</option>
                    <option>Neptune</option><option>Pluto</option>
                </select>
                <select id="searchP2" class="p-2 bg-slate-700 rounded text-white outline-none">
                    <option>Jupiter</option><option>Mars</option><option>Saturn</option>
                    <option>Moon</option><option>Mercury</option><option>Venus</option>
                    <option>Rahu</option><option>Ketu</option><option>Uranus</option>
                    <option>Neptune</option><option>Pluto</option>
                </select>
            </div>
            
            <label class="block text-xs mb-1 text-slate-400">Start Date</label>
            <input type="date" id="searchStart" class="w-full p-2 mb-2 bg-slate-700 rounded text-white outline-none">
            
            <label class="block text-xs mb-1 text-slate-400">End Date</label>
            <input type="date" id="searchEnd" class="w-full p-2 mb-2 bg-slate-700 rounded text-white outline-none">

            <label class="block text-xs mb-1 text-slate-400">Target Degree (e.g., 1, 5, 10)</label>
            <input type="number" id="searchDegree" value="1" step="0.1" min="0" max="15" class="w-full p-2 mb-3 bg-slate-700 rounded text-white outline-none">
            
            <button onclick="runSearch()" class="w-full bg-green-600 hover:bg-green-700 text-white p-2 rounded font-bold cursor-pointer">Search</button>
        </div>
        <div id="searchResults"></div>
    </div>

    <!-- Exact Conjunction Tab -->
    <div id="content-exact" class="content-section hidden">
        <div class="card border border-purple-600">
            <h2 class="text-lg font-bold mb-3 text-purple-400">Find Exact Conjunction</h2>
            <p class="text-xs text-slate-400 mb-3">Ye tab aapko exact same degree par hone wala conjunction dikhayega.</p>
            <div class="grid grid-cols-2 gap-2 mb-3">
                <select id="exactP1" class="p-2 bg-slate-700 rounded text-white outline-none">
                    <option>Moon</option><option>Mars</option><option>Jupiter</option><option>Saturn</option>
                    <option>Mercury</option><option>Venus</option>
                    <option>Rahu</option><option>Ketu</option><option>Uranus</option>
                    <option>Neptune</option><option>Pluto</option>
                </select>
                <select id="exactP2" class="p-2 bg-slate-700 rounded text-white outline-none">
                    <option>Saturn</option><option>Moon</option><option>Mars</option><option>Jupiter</option>
                    <option>Mercury</option><option>Venus</option>
                    <option>Rahu</option><option>Ketu</option><option>Uranus</option>
                    <option>Neptune</option><option>Pluto</option>
                </select>
            </div>
            <label class="block text-xs mb-1 text-slate-400">Start Date</label>
            <input type="date" id="exactStart" class="w-full p-2 mb-2 bg-slate-700 rounded text-white outline-none">
            <label class="block text-xs mb-1 text-slate-400">End Date</label>
            <input type="date" id="exactEnd" class="w-full p-2 mb-2 bg-slate-700 rounded text-white outline-none">
            
            <!-- NAYA INPUT: Maximum Difference -->
            <label class="block text-xs mb-1 text-slate-400">Maximum Difference (Degree) - e.g., 0.5, 1, 2</label>
            <input type="number" id="exactDegree" value="1" step="0.1" min="0" max="5" class="w-full p-2 mb-3 bg-slate-700 rounded text-white outline-none">

            <button onclick="runExactSearch()" class="w-full bg-purple-600 hover:bg-purple-700 text-white p-2 rounded font-bold cursor-pointer">Find Conjunction</button>
        </div>
        <div id="exactResults"></div>
    </div>

    <div class="text-xs text-center text-slate-500 mt-8 mb-4">
        ⚠️ Educational Purpose Only. Not Financial Advice.
    </div>

    <!-- Astronomy Engine (Pure JS) -->
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.js"></script>
    
    <!-- Normal Script (NOT MODULE) so HTML buttons can access functions -->
    <script src="app.js"></script>
</body>
</html>
